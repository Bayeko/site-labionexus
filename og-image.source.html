<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#fbfbf9;font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#171b22;position:relative}
  .page{position:relative;padding:60px 80px 0 80px;height:630px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:36px;letter-spacing:-.02em}
  .domain{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:500;color:#5c6572}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:36px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#0e6e8c}
  h1{margin-top:22px;font-size:58px;line-height:1.14;font-weight:800;letter-spacing:-.025em;max-width:1020px}
  h1 em{font-style:normal;background:linear-gradient(transparent 70%,rgba(14,110,140,.20) 70%)}
  .sub{margin-top:26px;font-size:25px;line-height:1.45;color:#5c6572;max-width:1000px}
  .chips{display:flex;gap:11px;margin-top:40px}
  .chip{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500;color:#5c6572;background:#f4f4f0;border:1px solid rgba(23,27,34,.12);border-radius:999px;padding:10px 18px}
  .chip.ch::before{content:"";display:inline-block;width:11px;height:11px;background:#d8232a;margin-right:9px;vertical-align:0}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="brand"><svg width="52" height="52" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#14161c"/><path d="M32 24 v44 h20" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M56 68 h6 l5 -12 6 20 5 -8 h6" stroke="#2aa3c4" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Labionexus</div>
    <div class="domain">labionexus.ch</div>
  </div>
  <div class="body">
    <div class="eyebrow">Lab automation and data in regulated environments</div>
    <h1>The result at the bench,<br>and the <em>record that has to trust it.</em></h1>
    <div class="sub">Amir Messadene, founder. The lab bench and GxP data: both sides of a reading.</div>
    <div class="chips">
      <div class="chip">Lonza &middot; purification and lab automation</div>
      <div class="chip">Roche &middot; GxP master data</div>
      <div class="chip ch">Switzerland</div>
    </div>
  </div>
</div>
</body>
</html>
